apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nava

resources:
  - ../../base

commonLabels:
  environment: production

# Production replicas
replicas:
  - name: gateway
    count: 3
  - name: auth-service
    count: 3
  - name: user-service
    count: 3
  - name: match-service
    count: 5
  - name: chat-service
    count: 5
  - name: payment-service
    count: 2
  - name: ambassador-service
    count: 2

patches:
  # Production resource limits
  - target:
      kind: Deployment
      name: match-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m

  - target:
      kind: Deployment
      name: chat-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m

  # Production database resources
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m

  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi
