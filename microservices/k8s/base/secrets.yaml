apiVersion: v1
kind: Secret
metadata:
  name: nava-secrets
  namespace: nava
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgres://nava:nava_secret@postgres:5432/nava_db"
  POSTGRES_USER: "nava"
  POSTGRES_PASSWORD: "nava_secret"
  POSTGRES_DB: "nava_db"

  # Neo4j
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "nava_secret"

  # JWT Secret (change in production!)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"

  # Twilio (replace with actual values)
  TWILIO_ACCOUNT_SID: "your_account_sid"
  TWILIO_AUTH_TOKEN: "your_auth_token"
  TWILIO_PHONE_NUMBER: "+1234567890"

  # Razorpay (replace with actual values)
  RAZORPAY_KEY_ID: "your_key_id"
  RAZORPAY_KEY_SECRET: "your_key_secret"
