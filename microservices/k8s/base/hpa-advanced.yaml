---
# Match Service - High traffic service (discovery/swiping)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: match-service-hpa
  namespace: nava
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: match-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15      # Scale up quickly for match service
      policies:
        - type: Pods
          value: 5                         # Add up to 5 pods quickly
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600     # Wait 10 min before scaling down
      policies:
        - type: Pods
          value: 2
          periodSeconds: 180
      selectPolicy: Min

---
# Chat Service - WebSocket connections need careful scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service-hpa
  namespace: nava
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 900     # Wait 15 min (WebSocket reconnects)
      policies:
        - type: Pods
          value: 1                         # Scale down slowly
          periodSeconds: 300
      selectPolicy: Min

