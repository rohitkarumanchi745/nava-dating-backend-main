# Advanced Horizontal Pod Autoscaler with scaling policies
# This provides smoother scaling behavior

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: nava
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30      # Wait 30s before scaling up
      policies:
        - type: Pods
          value: 4                         # Add max 4 pods at a time
          periodSeconds: 60
        - type: Percent
          value: 100                       # Or double the pods
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300     # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 2                         # Remove max 2 pods at a time
          periodSeconds: 120
        - type: Percent
          value: 25                        # Or reduce by 25%
          periodSeconds: 120
      selectPolicy: Min                    # Use slower scale down

