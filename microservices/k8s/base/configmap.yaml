apiVersion: v1
kind: ConfigMap
metadata:
  name: nava-config
  namespace: nava
data:
  # Service URLs (internal DNS)
  AUTH_SERVICE_URL: "http://auth-service:8001"
  USER_SERVICE_URL: "http://user-service:8002"
  MATCH_SERVICE_URL: "http://match-service:8003"
  CHAT_SERVICE_URL: "http://chat-service:8004"
  PAYMENT_SERVICE_URL: "http://payment-service:8005"
  AMBASSADOR_SERVICE_URL: "http://ambassador-service:8006"

  # Database URLs
  REDIS_URL: "redis://redis:6379"
  NEO4J_URI: "bolt://neo4j:7687"

  # Ports
  GATEWAY_PORT: "8000"
  AUTH_SERVICE_PORT: "8001"
  USER_SERVICE_PORT: "8002"
  MATCH_SERVICE_PORT: "8003"
  CHAT_SERVICE_PORT: "8004"
  PAYMENT_SERVICE_PORT: "8005"
  AMBASSADOR_SERVICE_PORT: "8006"

  # JWT
  JWT_EXPIRY: "3600"
