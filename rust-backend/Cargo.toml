[package]
name = "telugu-dating-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["json", "ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "request-id", "timeout", "compression-gzip"] }

# Async Runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "parking_lot"] }
futures = "0.3"
tokio-stream = "0.1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "rust_decimal"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Neo4j Graph Database
neo4rs = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.33", features = ["serde"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Time & UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Environment
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Image Processing
base64 = "0.22"
image = "0.25"

# ML - ONNX Runtime
tract-onnx = "0.21"

# Utilities
rand = "0.8"
thiserror = "1.0"
validator = { version = "0.16", features = ["derive"] }

# HTTP Client (for S3, external APIs)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto (for AWS Signature V4, CloudFront signing)
sha2 = "0.10"
hmac = "0.12"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# GraphQL
async-graphql = { version = "7.0.13", features = ["chrono", "uuid", "dataloader"] }
async-graphql-axum = "7.0.13"

# Metrics (optional, for production monitoring)
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = true
opt-level = 3

[dev-dependencies]
# Testing dependencies
tokio-test = "0.4"
