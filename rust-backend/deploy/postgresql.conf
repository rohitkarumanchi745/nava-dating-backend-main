# =============================================================================
# PostgreSQL Production Tuning for NAVA Platform
# =============================================================================
# Optimized for: dating app workload (write-heavy swipes, read-heavy discover)
# Target: 4 vCPU, 16GB RAM instance (e.g. RDS db.r6g.xlarge)
# Adjust shared_buffers and work_mem proportionally for different instance sizes.
# =============================================================================

# --- Connection Limits ---
# PgBouncer handles multiplexing; PG only needs connections for actual concurrency
max_connections = 100

# --- Memory ---
# 25% of total RAM for shared buffers
shared_buffers = 4GB

# Per-sort/hash operation memory. Keep conservative — many concurrent queries.
work_mem = 16MB

# For maintenance operations (VACUUM, CREATE INDEX). Can be generous.
maintenance_work_mem = 512MB

# OS page cache is effective; let PG rely on it
effective_cache_size = 12GB

# --- WAL (Write-Ahead Log) ---
# Larger WAL buffers reduce disk flushes during heavy writes (swipes, messages)
wal_buffers = 64MB

# Minimum WAL size before checkpoint. Larger = fewer checkpoints = less I/O spikes.
min_wal_size = 1GB

# Maximum WAL size. Controls how much WAL accumulates before forced checkpoint.
max_wal_size = 4GB

# Spread checkpoint writes over 90% of the checkpoint interval to avoid I/O bursts
checkpoint_completion_target = 0.9

# Time between automatic checkpoints (seconds). 15 min is good for write-heavy.
checkpoint_timeout = 900

# --- Background Writer ---
# Flushes dirty pages from shared buffers to disk in the background.
# Aggressive settings reduce checkpoint I/O spikes.
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 400
bgwriter_lru_multiplier = 4.0

# --- Autovacuum (Tuned for Partitioned Tables) ---
# More aggressive for append-heavy tables (interaction_events, messages, swipes)
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 500
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 250
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# --- Query Planner ---
# Favor index scans (SSDs have low random I/O cost)
random_page_cost = 1.1
effective_io_concurrency = 200
# Enable parallel query for large scans (discover, analytics)
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# --- Replication (for Read Replicas) ---
# Enable streaming replication to read replicas
wal_level = replica
max_wal_senders = 5
hot_standby = on
# Replicas can serve slightly stale data (100ms lag is fine for discover/matches)
max_standby_streaming_delay = 100ms

# --- Statement Timeout (Safety Net) ---
# Kill queries that run longer than 30 seconds (app also enforces this)
statement_timeout = 30000

# --- Logging ---
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms
