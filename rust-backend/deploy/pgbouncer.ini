; =============================================================================
; PgBouncer Configuration for NAVA Platform
; =============================================================================
; Sits between the Rust app pool and PostgreSQL.
; Multiplexes 300 app connections down to ~50 real PG connections.
; =============================================================================

[databases]
; Primary (read-write)
nava = host=postgres port=5432 dbname=nava user=nava

; Read replica (read-only workloads: discover, matches, history)
nava_read = host=postgres-replica port=5432 dbname=nava user=nava

[pgbouncer]
; --- Connection Limits ---
; Max client connections PgBouncer accepts (from app instances)
max_client_conn = 1000

; Max server connections to PostgreSQL per database
default_pool_size = 50

; Extra connections allowed when pool is exhausted (burst headroom)
reserve_pool_size = 10

; How long to wait before using reserve pool (seconds)
reserve_pool_timeout = 3

; Min connections kept open to each server (warm pool)
min_pool_size = 10

; --- Pooling Mode ---
; transaction: connection returned to pool after each transaction.
; Best for web apps — allows many clients to share few server connections.
pool_mode = transaction

; --- Server Reset ---
; CRITICAL: Reset session state when connection is returned to pool.
; Without this, SET statements from one client leak to the next.
; DISCARD ALL clears temp tables, prepared statements, and session vars.
server_reset_query = DISCARD ALL

; Disable server-side prepared statements in transaction pooling mode.
; sqlx uses the extended query protocol by default which is compatible,
; but named prepared statements would break across different clients.
; PgBouncer 1.21+ handles this automatically, but belt-and-suspenders.
max_prepared_statements = 0

; --- Timeouts ---
; Max time a client can hold a server connection without a query (seconds)
server_idle_timeout = 300

; Max time to wait for a connection from pool before failing
server_connect_timeout = 5

; Max lifetime of a server connection (seconds). Recycles connections to
; avoid PG backend memory bloat. Must match app's db_max_lifetime_secs.
server_lifetime = 1800

; Client-side query timeout (seconds). Kill queries that run too long.
query_timeout = 30

; How long a client can be idle before being disconnected
client_idle_timeout = 600

; --- Authentication ---
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; --- Logging ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; --- Listen ---
listen_addr = 0.0.0.0
listen_port = 6432

; --- Admin ---
admin_users = nava
stats_users = nava

; --- TCP Keepalive ---
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3

; --- DNS ---
dns_max_ttl = 15
