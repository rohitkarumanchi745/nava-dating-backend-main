# =============================================================================
# NAVA Backend - Service Account with IRSA (IAM Roles for Service Accounts)
# =============================================================================
# Allows pods to access AWS services (S3, SES, Secrets Manager) without
# embedding credentials. Create IAM role with trust policy for this SA.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: nava-backend-sa
  labels:
    app: nava-backend
  annotations:
    # Replace with your IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/nava-backend-role
