# =============================================================================
# NAVA Backend - Network Policies
# =============================================================================
# Restricts traffic to only necessary connections

# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app: nava-backend
spec:
  podSelector:
    matchLabels:
      app: nava-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ALB/Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080

    # Allow traffic from other nava pods (internal service mesh)
    - from:
        - podSelector:
            matchLabels:
              app: nava-backend
      ports:
        - protocol: TCP
          port: 8080

    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow RDS (external)
    - ports:
        - protocol: TCP
          port: 5432

    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow ElastiCache (external)
    - ports:
        - protocol: TCP
          port: 6379

    # Allow Neo4j
    - ports:
        - protocol: TCP
          port: 7687

    # Allow HTTPS outbound (S3, external APIs, SMTP)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
