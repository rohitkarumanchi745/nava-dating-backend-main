# =============================================================================
# NAVA Backend - Kubernetes Ingress (NGINX Ingress Controller)
# =============================================================================
# Handles external traffic routing, SSL termination, and WebSocket support

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nava-backend-ingress
  labels:
    app: nava-backend
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # WebSocket support (required for chat and calls)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "nava-backend"

    # Rate limiting at ingress level (additional layer)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"

    # Request body size — video reels can be up to 100MB raw from iOS
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

    # SSL/TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.nava.dating,https://nava.dating"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

spec:
  tls:
    - hosts:
        - api.nava.dating
      secretName: nava-api-tls

  rules:
    - host: api.nava.dating
      http:
        paths:
          # Main API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nava-backend
                port:
                  number: 80

---
