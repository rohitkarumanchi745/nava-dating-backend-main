# =============================================================================
# NAVA Backend - Kubernetes Secrets Template
# =============================================================================
# IMPORTANT: Do NOT commit this file with real values!
# Use: kubectl create secret generic nava-secrets --from-env-file=.env.production
# Or use external secrets manager (AWS Secrets Manager, HashiCorp Vault, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: nava-secrets
  labels:
    app: nava-backend
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://nava:CHANGE_ME@pgbouncer:6432/nava_prod?sslmode=require"

  # Redis
  REDIS_URL: "redis://redis-master:6379"

  # Neo4j
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME"

  # Authentication - Generate with: openssl rand -base64 64
  SECRET_KEY: "CHANGE_THIS_TO_A_SECURE_64_CHARACTER_OR_LONGER_RANDOM_STRING"

  # SMTP
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_USERNAME: "apikey"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "NAVA <noreply@nava.dating>"

  # RevenueCat
  REVENUECAT_WEBHOOK_SECRET: "CHANGE_ME"

  # AWS S3 (if using S3 storage)
  # AWS_ACCESS_KEY_ID: "CHANGE_ME"
  # AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  # S3_BUCKET: "nava-production"
  # S3_REGION: "us-east-1"

  # LLM Service
  LLM_API_URL: "http://llm-service:8000"
  LLM_MODEL_NAME: "llama3"

  # CORS (comma-separated)
  CORS_ALLOWED_ORIGINS: "https://app.nava.dating,https://nava.dating"
