# =============================================================================
# Dev/Staging Secrets - In-Cluster Services
# =============================================================================
# IMPORTANT: Replace placeholder values before applying
# Use: kubectl create secret generic nava-secrets --from-env-file=.env.dev

apiVersion: v1
kind: Secret
metadata:
  name: nava-secrets
  labels:
    app: nava-backend
    environment: dev
type: Opaque
stringData:
  DATABASE_URL: "postgresql://nava:changeme@postgres:5432/nava_dev"
  POSTGRES_PASSWORD: "changeme"
  REDIS_URL: "redis://redis:6379"
  SECRET_KEY: "dev-only-change-this-to-64-chars-minimum-for-production-use"
  SMTP_HOST: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: "NAVA Dev <noreply@dev.nava.dating>"
