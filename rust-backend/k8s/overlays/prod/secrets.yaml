# =============================================================================
# Production Secrets - AWS Managed Services
# =============================================================================
# IMPORTANT: In production, use AWS Secrets Manager + External Secrets Operator
# instead of storing secrets directly in K8s manifests.
#
# Install: helm install external-secrets external-secrets/external-secrets
# Then use ExternalSecret CRD to sync from AWS Secrets Manager.
#
# This file is a TEMPLATE only. Never commit real credentials.

apiVersion: v1
kind: Secret
metadata:
  name: nava-secrets
  labels:
    app: nava-backend
    environment: production
type: Opaque
stringData:
  # RDS PostgreSQL (replace with actual RDS endpoint)
  DATABASE_URL: "postgresql://nava:CHANGE_ME@nava-prod.xxxxxxxxxxxx.us-east-1.rds.amazonaws.com:5432/nava_prod?sslmode=require"

  # ElastiCache Redis (replace with actual endpoint)
  REDIS_URL: "redis://nava-prod.xxxxxx.0001.use1.cache.amazonaws.com:6379"

  # Authentication - Generate with: openssl rand -base64 64
  SECRET_KEY: "CHANGE_THIS_TO_A_SECURE_64_CHARACTER_OR_LONGER_RANDOM_STRING"

  # Neo4j (if using)
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME"

  # SMTP (SendGrid/SES)
  SMTP_HOST: "email-smtp.us-east-1.amazonaws.com"
  SMTP_USERNAME: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "NAVA <noreply@nava.dating>"

  # RevenueCat
  REVENUECAT_WEBHOOK_SECRET: "CHANGE_ME"

  # CORS
  CORS_ALLOWED_ORIGINS: "https://app.nava.dating,https://nava.dating"
