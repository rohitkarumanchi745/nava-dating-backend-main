# =============================================================================
# Production Deployment Patch
# =============================================================================
# Overrides base deployment for production: more resources, topology spread

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nava-backend
spec:
  replicas: 3
  template:
    spec:
      serviceAccountName: nava-backend-sa
      containers:
        - name: nava-backend
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "3Gi"
              cpu: "3000m"
      # Spread pods across AZs for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nava-backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nava-backend
