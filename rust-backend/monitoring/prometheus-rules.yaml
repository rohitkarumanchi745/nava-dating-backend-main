# Prometheus Alerting Rules for Nava Dating Platform
# Deploy to Prometheus/AlertManager for production monitoring
#
# Usage with Kubernetes:
#   kubectl create configmap prometheus-rules --from-file=prometheus-rules.yaml -n monitoring
#
# For standalone Prometheus, add to prometheus.yml:
#   rule_files:
#     - "prometheus-rules.yaml"

groups:
  # ==========================================================================
  # API Health & Availability Alerts
  # ==========================================================================
  - name: api_availability
    rules:
      - alert: APIHighErrorRate
        expr: |
          sum(rate(app_errors_total[5m])) / sum(rate(app_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High API error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook_url: "https://docs.nava.app/runbooks/high-error-rate"

      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 2s)"

      - alert: APIEndpointDown
        expr: up{job="nava-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Nava API endpoint is down"
          description: "Instance {{ $labels.instance }} is not responding"

      - alert: HighRequestVolume
        expr: |
          sum(rate(app_requests_total[1m])) > 1000
        for: 5m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "High request volume detected"
          description: "Processing {{ $value | humanize }} requests/second"

  # ==========================================================================
  # Database Health Alerts
  # ==========================================================================
  - name: database_health
    rules:
      - alert: PostgreSQLConnectionPoolExhausted
        expr: |
          pg_stat_activity_count{state="active"} / pg_settings_max_connections > 0.85
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of connections in use"

      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_statements_seconds_total[5m]) / rate(pg_stat_statements_calls_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow PostgreSQL queries detected"
          description: "Average query time is {{ $value | humanizeDuration }}"

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL replication lag is high"
          description: "Replication lag is {{ $value }}s (threshold: 30s)"

      - alert: RedisConnectionFailed
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis connection failed"
          description: "Cannot connect to Redis instance {{ $labels.instance }}"

      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis using {{ $value | humanizePercentage }} of available memory"

      - alert: Neo4jConnectionFailed
        expr: neo4j_up == 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Neo4j connection failed"
          description: "Cannot connect to Neo4j instance"

  # ==========================================================================
  # Payment System Alerts
  # ==========================================================================
  - name: payment_health
    rules:
      - alert: PaymentFailureRateHigh
        expr: |
          sum(rate(payment_transactions_total{status="failed"}[15m]))
          / sum(rate(payment_transactions_total[15m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "High payment failure rate"
          description: "{{ $value | humanizePercentage }} of payments failing"

      - alert: DLQBacklogGrowing
        expr: |
          sum(dlq_entries_pending) > 100
        for: 15m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "Dead letter queue backlog growing"
          description: "{{ $value }} entries pending in DLQ"

      - alert: DLQProcessingStalled
        expr: |
          increase(dlq_entries_resolved_total[30m]) == 0
          and sum(dlq_entries_pending) > 0
        for: 30m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "DLQ processing appears stalled"
          description: "No DLQ entries resolved in 30 minutes with {{ $value }} pending"

      - alert: PaymentGatewayUnreachable
        expr: |
          sum(rate(payment_gateway_errors_total{type="connection"}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Payment gateway unreachable"
          description: "Gateway {{ $labels.gateway }} returning connection errors"

      - alert: WebhookProcessingFailure
        expr: |
          sum(rate(webhook_processing_errors_total[15m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "Webhook processing failures detected"
          description: "{{ $value | humanize }} webhook failures per second"

  # ==========================================================================
  # Infrastructure & Resource Alerts
  # ==========================================================================
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"

      - alert: DiskSpaceLow
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }}%"

      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="nava"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} has restarted {{ $value }} times"

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{namespace="nava", condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod has been in not-ready state for 5 minutes"

  # ==========================================================================
  # WebSocket & Real-time Alerts
  # ==========================================================================
  - name: websocket_health
    rules:
      - alert: HighWebSocketConnections
        expr: app_websocket_connections > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High number of WebSocket connections"
          description: "{{ $value }} active WebSocket connections"

      - alert: WebSocketConnectionDrops
        expr: |
          rate(websocket_connection_drops_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High WebSocket connection drop rate"
          description: "{{ $value }} connections dropping per second"

  # ==========================================================================
  # Business Metrics Alerts
  # ==========================================================================
  - name: business_metrics
    rules:
      - alert: LowUserActivityWeekend
        expr: |
          (day_of_week() >= 6 or day_of_week() == 0)
          and sum(rate(app_requests_total[1h])) < 100
        for: 2h
        labels:
          severity: info
          team: growth
        annotations:
          summary: "Low user activity on weekend"
          description: "Only {{ $value }} requests/second during peak hours"

      - alert: MatchRateDropped
        expr: |
          sum(rate(matches_created_total[1h])) / sum(rate(swipes_total[1h])) < 0.01
        for: 1h
        labels:
          severity: info
          team: growth
        annotations:
          summary: "Match rate has dropped significantly"
          description: "Match rate is {{ $value | humanizePercentage }}"

      - alert: PremiumConversionLow
        expr: |
          sum(rate(premium_conversions_total[24h])) / sum(rate(new_users_total[24h])) < 0.02
        for: 24h
        labels:
          severity: info
          team: growth
        annotations:
          summary: "Premium conversion rate is low"
          description: "Only {{ $value | humanizePercentage }} of new users converting"

  # ==========================================================================
  # Security Alerts
  # ==========================================================================
  - name: security
    rules:
      - alert: HighRateLimitHits
        expr: |
          sum(rate(rate_limit_exceeded_total[5m])) > 100
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate limit hit rate"
          description: "{{ $value }} rate limit blocks per second"

      - alert: SuspiciousAuthAttempts
        expr: |
          sum(rate(auth_failures_total[5m])) by (ip) > 10
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Suspicious authentication attempts"
          description: "{{ $value }} failed auth attempts from {{ $labels.ip }}"

      - alert: UnauthorizedAPIAccess
        expr: |
          sum(rate(http_requests_total{status="403"}[5m])) > 50
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate of unauthorized API access"
          description: "{{ $value }} 403 responses per second"
