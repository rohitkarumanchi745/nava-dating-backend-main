# AlertManager Configuration for Nava Dating Platform
# Routes alerts to appropriate channels based on severity and team
#
# Environment variables required:
#   - SLACK_WEBHOOK_URL: Slack incoming webhook URL
#   - PAGERDUTY_SERVICE_KEY: PagerDuty integration key
#   - SMTP_SMARTHOST: SMTP server for email alerts
#   - SMTP_FROM: Email sender address
#
# Deploy with:
#   kubectl create secret generic alertmanager-config \
#     --from-file=alertmanager.yaml -n monitoring

global:
  # Slack webhook for team notifications
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # SMTP configuration for email alerts
  smtp_smarthost: '${SMTP_SMARTHOST}'
  smtp_from: 'alerts@nava.app'
  smtp_require_tls: true

  # Resolve timeout
  resolve_timeout: 5m

# Route tree for alert routing
route:
  # Default receiver
  receiver: 'slack-platform'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'team']

  # Wait time before sending first notification
  group_wait: 30s

  # Time between notifications for same group
  group_interval: 5m

  # Time before resending same alert
  repeat_interval: 4h

  routes:
    # Critical alerts -> PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
      routes:
        - match:
            team: payments
          receiver: 'slack-payments-urgent'
        - match:
            team: platform
          receiver: 'slack-platform-urgent'

    # Payment team alerts
    - match:
        team: payments
      receiver: 'slack-payments'
      routes:
        - match:
            severity: warning
          receiver: 'slack-payments'
        - match:
            severity: critical
          receiver: 'pagerduty-payments'

    # Platform team alerts
    - match:
        team: platform
      receiver: 'slack-platform'
      routes:
        - match:
            severity: warning
          receiver: 'slack-platform'
        - match:
            severity: critical
          receiver: 'pagerduty-platform'

    # Security alerts -> Security channel + email
    - match:
        team: security
      receiver: 'slack-security'
      routes:
        - match:
            severity: critical
          receiver: 'email-security'

    # Growth/business alerts -> Growth channel
    - match:
        team: growth
      receiver: 'slack-growth'

# Inhibition rules to prevent alert storms
inhibit_rules:
  # If API is down, don't alert about specific endpoint issues
  - source_match:
      alertname: 'APIEndpointDown'
    target_match_re:
      alertname: '(APIHighErrorRate|APIHighLatency|PaymentFailureRateHigh)'
    equal: ['instance']

  # If database is down, don't alert about slow queries
  - source_match:
      alertname: 'PostgreSQLConnectionFailed'
    target_match_re:
      alertname: '(PostgreSQLSlowQueries|PostgreSQLConnectionPoolExhausted)'
    equal: ['instance']

  # Critical alerts suppress warning alerts for same issue
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Receiver definitions
receivers:
  # Platform team Slack channel
  - name: 'slack-platform'
    slack_configs:
      - channel: '#nava-platform-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: >-
          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}

          *Severity:* {{ .CommonLabels.severity }}

          *Instance:* {{ .CommonLabels.instance }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # Platform urgent (critical alerts)
  - name: 'slack-platform-urgent'
    slack_configs:
      - channel: '#nava-platform-urgent'
        send_resolved: true
        title: 'CRITICAL: {{ .CommonLabels.alertname }}'
        text: >-
          @channel URGENT ACTION REQUIRED

          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}

          *Runbook:* {{ .CommonAnnotations.runbook_url }}
        color: 'danger'

  # Payments team Slack channel
  - name: 'slack-payments'
    slack_configs:
      - channel: '#nava-payments-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: >-
          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}

          *Gateway:* {{ .CommonLabels.gateway }}
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Payments urgent
  - name: 'slack-payments-urgent'
    slack_configs:
      - channel: '#nava-payments-urgent'
        send_resolved: true
        title: 'CRITICAL PAYMENT ISSUE: {{ .CommonLabels.alertname }}'
        text: >-
          @channel URGENT: Payment system issue detected

          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}
        color: 'danger'

  # Security team Slack channel
  - name: 'slack-security'
    slack_configs:
      - channel: '#nava-security-alerts'
        send_resolved: true
        title: 'Security Alert: {{ .CommonLabels.alertname }}'
        text: >-
          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}

          *Source IP:* {{ .CommonLabels.ip }}
        color: 'danger'

  # Growth team Slack channel
  - name: 'slack-growth'
    slack_configs:
      - channel: '#nava-growth-metrics'
        send_resolved: true
        title: 'Growth Alert: {{ .CommonLabels.alertname }}'
        text: >-
          *Alert:* {{ .CommonAnnotations.summary }}

          *Description:* {{ .CommonAnnotations.description }}
        color: 'warning'

  # PagerDuty for critical platform alerts
  - name: 'pagerduty-platform'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_PLATFORM_KEY}'
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          instance: '{{ .CommonLabels.instance }}'
          description: '{{ .CommonAnnotations.description }}'

  # PagerDuty for critical payment alerts
  - name: 'pagerduty-payments'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_PAYMENTS_KEY}'
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          gateway: '{{ .CommonLabels.gateway }}'
          description: '{{ .CommonAnnotations.description }}'

  # PagerDuty for all critical alerts
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_CRITICAL_KEY}'
        severity: 'critical'
        description: 'CRITICAL: {{ .CommonAnnotations.summary }}'

  # Email for security critical alerts
  - name: 'email-security'
    email_configs:
      - to: 'security-team@nava.app'
        send_resolved: true
        headers:
          Subject: '[SECURITY ALERT] {{ .CommonLabels.alertname }}'
        html: |
          <h2>Security Alert: {{ .CommonLabels.alertname }}</h2>
          <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>

# Templates for customizing notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'
